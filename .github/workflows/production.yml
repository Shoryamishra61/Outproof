name: Production verification
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [master]
permissions:
  contents: read
concurrency:
  group: production-verification
  cancel-in-progress: false
jobs:
  public-flow:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.9'
      - run: uv sync --python 3.12 --locked
      - name: Verify real compilation after deployment
        env:
          PYTHONPATH: services/api:.
          EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: uv run python scripts/verify_production.py --commit "$EXPECTED_COMMIT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-verification
          path: artifacts/release/production-verification.json
          retention-days: 7
