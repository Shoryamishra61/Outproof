name: Checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: uv sync --python 3.12 --locked
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest
      - run: uv run python scripts/export_contracts.py --check
      - run: uv run python evals/runner/contracts.py
      - run: uv run python -m evals.runner.policy
      - run: npm ci --prefix apps/web && npm run check --prefix apps/web
      - run: node --check scripts/verify_public_origin.mjs
      - run: uv run pip-audit --local --format json --output artifacts/release/python-dependency-audit.json
      - run: npm audit --prefix apps/web --audit-level=high --json > artifacts/release/npm-dependency-audit.json
      - run: uv run python scripts/scan_secrets.py
      - run: npx --prefix apps/web playwright install --with-deps chromium
      - run: npx --prefix apps/web playwright test --config apps/web/playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence
          path: |
            artifacts/release/
            apps/web/test-results/
          retention-days: 7
