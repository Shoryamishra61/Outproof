[project]
name = "ground-rule"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "opening-hours-py==2.1.4",
  "pydantic>=2.10,<3",
  "tzdata>=2025.2",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["jsonschema>=4.23,<5", "pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["packages/domain/src"]

[tool.pytest.ini_options]
pythonpath = [".", "packages/domain/src", "services/api"]
testpaths = ["tests"]
markers = ["integration: opt-in live external provider checks"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
